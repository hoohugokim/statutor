# Publish statutor to PyPI on a version tag, via PyPI trusted publishing —
# no API tokens live in this repo. Versions are immutable: the tag/version
# guard below fails the run before anything is uploaded on a mismatch.
#
# ONE-TIME human setup (PyPI UI): project "statutor" → Settings → Publishing
# → add a pending trusted publisher:
#   owner hoohugokim | repository statutor | workflow publish.yml
#   (leave environment empty to match this file)

name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: build and publish via trusted publishing
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — the only permission trusted publishing needs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag != pyproject.toml version $ver — PyPI versions are immutable; fix before re-tagging"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
