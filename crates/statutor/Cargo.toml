[package]
name = "statutor"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Native staged-index validator for Statutor ledgers, conformance-gated against the canonical Python kernel."
repository = "https://github.com/hoohugokim/statutor"
readme = "README.md"
keywords = ["git", "pre-commit", "governance", "ledger", "agents"]
categories = ["development-tools"]
include = [
    "/src/lib.rs",
    "/src/main.rs",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "statutor"
path = "src/lib.rs"

[[bin]]
name = "statutor-staged"
path = "src/main.rs"

[dependencies]
yaml-rust2 = "0.10"
